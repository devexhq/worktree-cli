name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      COLUMNS: "160"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        # fail_under=80 is configured in pyproject.toml [tool.coverage.report]
        run: uv run python -m pytest --cov=worktree --cov-report=term-missing --cov-report=xml tests/ -q -n auto

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  complexity:
    name: Complexity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run complexipy against the changeset
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'src/**/*.py')
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No changed src/**/*.py files; skipping complexity check."
            exit 0
          fi

          echo "Changed files:"
          printf '  %s\n' "${FILES[@]}"
          uv run inv complexity --paths "$(IFS=,; echo "${FILES[*]}")"

  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, test, complexity]
    if: ${{ always() }}
    steps:
      - name: Check upstream job results
        run: |
          echo "lint result: ${{ needs.lint.result }}"
          echo "test result: ${{ needs.test.result }}"
          echo "complexity result: ${{ needs.complexity.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.complexity.result }}" != "success" ]; then
            echo "CI Gate failed because at least one dependency failed."
            exit 1
          fi
