name: Publish Dev Build to PyPI

on:
  push:
    branches:
      - main  # Triggers automatically on every commit pushed to main

jobs:
  pypi-dev-publish:
    name: Build and Upload Dev Tag
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for Trusted Publishing OIDC token verification

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Compiling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build Distribution Packages with Dev Flag
        env:
          WORKTREE_DEV_BUILD: "true" # Injects the flag our setup.py is looking for
        run: python -m build

      - name: Deploy Securely to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
