name: Publish to PyPI

on:
  release:
    types: [published] # Triggers automatically when you hit "Publish Release" on GitHub

jobs:
  pypi-publish:
    name: Build and Upload to PyPI
    runs-on: ubuntu-latest
    # CRITICAL: These grant permissions required for UI-releases and Trusted Publishing
    permissions:
      id-token: write   # Allows secure, tokenless PyPI authentication
      contents: write   # Allows reading the repository history and tags

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Fetches all git tags so hatch-vcs can extract the version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Environment
        run: uv python install 3.13

      - name: Build Distribution Packages
        run: uv build

      - name: Deploy Securely to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
