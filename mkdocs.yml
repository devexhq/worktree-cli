site_name: Worktree Documentation
site_description: Documentation for Worktree (wt) - isolated Git worktrees and AI agent workspaces
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - CLI Reference:
      - Workflow: cli/workflow.md
      - Task: cli/task.md
      - Sandbox: cli/sandbox.md
      - Catalog: cli/catalog.md
exclude_docs: |
  agents/*
  agents/**/*
