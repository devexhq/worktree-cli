[tool.pytest.ini_options]
addopts = ""
python_classes = ["Test*", "*Tests"]

[tool.coverage.run]
source = ["getworktree"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git",
    ".worktree",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, C4 comprehensions,
# UP pyupgrade, RUF ruff, FA future-annotations, D pydocstyle (Google).
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "FA", "D"]
# E501 handled by formatter; FA100 allow missing future annotations;
# D100/D104/D105/D107 skip noisy docstring requirements.
ignore = ["E501", "FA100", "D100", "D104", "D105", "D107"]
dummy-variable-rgx = "^_$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D"]
"setup.py" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["getworktree"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = [
    "typer.main.Typer.command",
    "typer.main.Typer.callback",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
