[project]
name = "worktree-cli"
dynamic = ["version"]
authors = [
    { name = "DevEx HQ Team", email = "team@devexhq.com" }
]
description = "Isolated Git worktrees for developer and AI agent automated workflow management.."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
]

[project.urls]
Homepage = "https://devexhq.github.io/worktree-cli/"
Repository = "https://github.com/devexhq/worktree-cli"
"Bug Tracker" = "https://github.com/devexhq/worktree-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.6.0",
    "invoke>=2.0.0",
    "complexipy>=6.2.0",
    "basedpyright>=1.39.10",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
cursor = [
    "cursor-sdk>=1.0.26,<2",
]

[project.scripts]
wt = "worktree.cli.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Installable import package lives at src/worktree (src-layout).
[tool.hatch.build.targets.wheel]
packages = ["src/worktree"]
# Editable: add src/ to sys.path via .pth only (avoid copying into site-packages).
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

# Hatchling replacement for your dynamic GitHub Actions version script
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Ensures git tags like v1.0.0b1 map perfectly to PyPI version standards
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = ""
# Repo root must be importable so `tests.*` helpers resolve when invoked via the
# `pytest` console script (sys.path[0] is not cwd in that mode).
pythonpath = ["."]
python_classes = ["Test*", "*Tests"]

[tool.coverage.run]
source = ["worktree"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    ".worktree",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, C4 comprehensions,
# UP pyupgrade, RUF ruff, FA future-annotations, D pydocstyle (Google).
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "FA", "D"]
# E501 handled by formatter; FA100 allow missing future annotations;
# D100/D101/D104/D105/D107 skip noisy docstring requirements.
ignore = ["E501", "FA100", "D100", "D104", "D105", "D107", "D101"]
dummy-variable-rgx = "^_$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["worktree"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = [
    "typer.main.Typer.command",
    "typer.main.Typer.callback",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]

[tool.basedpyright]
# Package-only gate for the ljb/typing rollout. Tests stay untyped until the
# library surface is clean under recommended mode.
include = ["src"]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "site",
    "scratch",
]
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "recommended"
venvPath = "."
venv = ".venv"

# Framework / Pydantic noise that dominates first-run volume without catching
# real package bugs. Keep true type errors as errors; leave most unknown/Any
# rules at recommended defaults so they remain visible as warnings.
reportCallInDefaultInitializer = "none"  # Typer Option()/Argument() defaults
reportUnusedParameter = "none"  # Typer ctx and callback-required params
reportUnannotatedClassAttribute = "none"  # Pydantic model_config / ClassVar flood
reportUnusedCallResult = "none"  # Path.mkdir, list.append-style intentional discards
