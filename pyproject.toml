[project]
name = "getworktree"
dynamic = ["version"]
authors = [
    { name = "Worktree Team", email = "hello@getworktree.io" }
]
description = "Isolated git worktree developer workflows and AI agent workspaces."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://getworktree.io"
Repository = "https://github.com"
"Bug Tracker" = "https://github.com/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "invoke>=2.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
cursor = [
    "cursor-sdk>=1.0.26,<2",
]

[project.scripts]
wt = "getworktree.cli.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Hatchling replacement for find_packages(exclude=...) and package_data
[tool.hatch.build.targets.wheel]
packages = ["getworktree"]

# Hatchling replacement for your dynamic GitHub Actions version script
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Ensures git tags like v1.0.0b1 map perfectly to PyPI version standards
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = ""
python_classes = ["Test*", "*Tests"]

[tool.coverage.run]
source = ["getworktree"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    ".worktree",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, C4 comprehensions,
# UP pyupgrade, RUF ruff, FA future-annotations, D pydocstyle (Google).
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "FA", "D"]
# E501 handled by formatter; FA100 allow missing future annotations;
# D100/D104/D105/D107 skip noisy docstring requirements.
ignore = ["E501", "FA100", "D100", "D104", "D105", "D107"]
dummy-variable-rgx = "^_$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["getworktree"]
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = [
    "typer.main.Typer.command",
    "typer.main.Typer.callback",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
