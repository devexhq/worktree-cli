# Target Python version matching modern standards
target-version = "py311"

# Line length matching default formatter standards
line-length = 88

# Files/directories to exclude
exclude = [
    ".git",
    ".worktree",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

# ------------------------------------------------------------------------------
# LINTING CONFIGURATION
# ------------------------------------------------------------------------------
[lint]
# Selected rule sets:
# F   -> Pyflakes (fundamental syntax and logic errors)
# E/W -> pycodestyle (PEP8 errors and warnings)
# I   -> isort (import sorting)
# B   -> flake8-bugbear (common bug patterns & design smells)
# C4  -> flake8-comprehensions (simplifies list/dict comprehensions)
# UP  -> pyupgrade (enforces modern Python syntax)
# RUF -> Ruff-specific (implicit Optional, py version tags, etc.)
# FA  -> flake8-future-annotations (consistent postponed evaluation)
# D   -> pydocstyle (Google convention via [lint.pydocstyle])
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "FA", "D"]

# Rules to ignore:
# E501 -> Line length violations (handled cleanly by the formatter instead)
# FA100 -> Allow modules without `from __future__ import annotations`
# D104  -> Package __init__ docstrings not required
# D105  -> Magic methods
ignore = ["E501", "FA100", "D104", "D105"]

# Ignore unused variables when prefixed with an underscore (e.g., `_`, `_ctx`)
dummy-variable-rgx = "^_$"

[lint.per-file-ignores]
# Allow unused imports in __init__.py files (useful for module exports)
"__init__.py" = ["F401"]
# Tests: behavior is documented by test names; skip pydocstyle churn
"tests/*" = ["D"]
# Packaging shim: no public API surface
"setup.py" = ["D"]

[lint.isort]
combine-as-imports = true
known-first-party = ["getworktree"]
split-on-trailing-comma = true

[lint.pydocstyle]
convention = "google"
ignore-decorators = [
    "typer.main.Typer.command",
    "typer.main.Typer.callback",
]

# ------------------------------------------------------------------------------
# FORMATTER CONFIGURATION (Black compatibility)
# ------------------------------------------------------------------------------
[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
